<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V1 Ledger — Your Debt Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-navy: #14213D;
    --ink-navy-deep: #0D1730;
    --paper: #FBF6EA;
    --paper-shadow: #E7DFC9;
    --signboard-gold: #F2A900;
    --naira-green: #157A46;
    --hot-clay: #E8502B;
    --ink-soft: #6B7280;
    --ink-faint: #9AA1B5;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Work Sans', -apple-system, sans-serif;
    background: var(--ink-navy);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(242,169,0,0.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(21,122,70,0.10), transparent 45%);
    color: var(--paper);
    margin: 0;
    padding: 20px 16px 48px;
    min-height: 100vh;
  }

  .signboard {
    background: var(--signboard-gold);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 10px 24px rgba(0,0,0,0.28);
    position: relative;
    overflow: hidden;
  }
  .signboard::after {
    content: "";
    position: absolute;
    top: -30%; right: -10%;
    width: 140px; height: 140px;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
  }
  .signboard .eyebrow {
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-navy-deep);
    opacity: 0.65;
    margin-bottom: 2px;
  }
  .signboard h1 {
    font-family: 'Bungee', 'Work Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(26px, 8vw, 34px);
    line-height: 1.05;
    color: var(--ink-navy-deep);
    margin: 0;
    letter-spacing: 0.01em;
  }

  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat {
    flex: 1;
    background: var(--ink-navy-deep);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stat .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .stat .value {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 21px;
    color: var(--paper);
  }
  .stat.owed .value { color: var(--signboard-gold); }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px 4px;
  }

  .debt-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .stub {
    background: var(--paper);
    color: var(--ink-navy-deep);
    border-radius: 4px;
    position: relative;
    padding: 16px 16px 14px;
    box-shadow: 0 4px 0 var(--paper-shadow), 0 8px 16px rgba(0,0,0,0.25);
  }
  .stub::before {
    content: "";
    position: absolute;
    top: -6px; left: 0; right: 0;
    height: 12px;
    background-image: radial-gradient(circle, var(--ink-navy) 3.5px, transparent 3.6px);
    background-size: 16px 12px;
    background-position: 8px 0;
  }
  .stub.is-paid {
    opacity: 0.72;
  }

  .stub-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .stub-name {
    font-family: 'Bungee', sans-serif;
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .stub-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 17px;
    white-space: nowrap;
  }

  .stub-partial-note {
    font-size: 12px;
    color: var(--naira-green);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .stub-divider {
    border: none;
    border-top: 1px dashed rgba(20,33,61,0.25);
    margin: 10px 0 12px;
  }

  .stub-actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    display: inline-block;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-remind {
    background: var(--naira-green);
    color: #EFFBEF;
  }
  .btn-paid {
    background: transparent;
    color: var(--hot-clay);
    border: 1.5px solid var(--hot-clay);
  }
  .btn-delete {
    flex: 0 0 auto;
    background: transparent;
    color: var(--ink-faint);
    border: 1.5px solid rgba(20,33,61,0.2);
    width: 38px;
    padding: 10px 0;
    font-size: 15px;
  }

  .payment-form {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .payment-input {
    flex: 1;
    border: 1.5px solid rgba(20,33,61,0.25);
    border-radius: 8px;
    padding: 9px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    background: white;
    color: var(--ink-navy-deep);
    min-width: 0;
  }

  .stamp {
    position: absolute;
    top: 10px;
    right: 14px;
    border: 2.5px solid var(--naira-green);
    color: var(--naira-green);
    font-family: 'Bungee', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 6px;
    transform: rotate(8deg);
    opacity: 0.85;
    animation: stamp-in 0.25s ease-out;
  }
  @keyframes stamp-in {
    from { transform: rotate(8deg) scale(1.6); opacity: 0; }
    to { transform: rotate(8deg) scale(1); opacity: 0.85; }
  }

  .empty {
    background: var(--ink-navy-deep);
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
    line-height: 1.6;
  }
  .empty strong {
    display: block;
    color: var(--paper);
    font-family: 'Bungee', sans-serif;
    font-size: 15px;
    font-weight: 400;
    margin-bottom: 6px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .tab {
    flex: 1;
    background: var(--ink-navy-deep);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--ink-faint);
    border-radius: 8px;
    padding: 9px 6px;
    font-family: 'Work Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active {
    background: var(--signboard-gold);
    border-color: var(--signboard-gold);
    color: var(--ink-navy-deep);
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

<div class="signboard">
  <div class="eyebrow">V1 · Debt Book</div>
  <h1>Who Owes You</h1>
</div>

<div class="stats">
  <div class="stat owed">
    <div class="label">Outstanding</div>
    <div class="value" id="totalOutstanding">₦0</div>
  </div>
  <div class="stat">
    <div class="label">Unpaid</div>
    <div class="value" id="unpaidCount">0</div>
  </div>
</div>

<div class="section-label">Ledger</div>
<div class="tabs">
  <button class="tab active" id="tabAll" onclick="setFilter('all')">All</button>
  <button class="tab" id="tabUnpaid" onclick="setFilter('unpaid')">Unpaid</button>
  <button class="tab" id="tabPaid" onclick="setFilter('paid')">Paid</button>
</div>
<div class="debt-list" id="debtList">
  <div class="empty">Loading your ledger…</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const chatId = params.get('chat');
  const accessToken = params.get('token');
  let businessName = '';
  let allDebts = [];
  let currentFilter = 'all';
  const paymentFormOpenFor = new Set(); // which debt IDs currently show the "log payment" input

  if (!chatId || !accessToken) {
    document.getElementById('debtList').innerHTML =
      '<div class="empty"><strong>No account linked</strong>Send /dashboard to the bot on Telegram to get your personal link.</div>';
  } else {
    init();
  }

  function remaining(debt) {
    return debt.amount - (debt.amountPaid || 0);
  }

  async function init() {
    await loadOwner();
    await loadDebts();
  }

  async function loadOwner() {
    const res = await fetch(`/api/owner/${chatId}?token=${accessToken}`);
    if (res.status === 403) return showAccessDenied();
    const owner = await res.json();
    businessName = owner.businessName || '';
  }

  async function loadDebts() {
    const res = await fetch(`/api/debts/${chatId}?token=${accessToken}`);
    if (res.status === 403) return showAccessDenied();
    allDebts = await res.json();
    render();
  }

  function showAccessDenied() {
    document.getElementById('debtList').innerHTML =
      '<div class="empty"><strong>Access denied</strong>This link is invalid or expired. Send /dashboard to the bot on Telegram to get a fresh one.</div>';
  }

  function setFilter(filter) {
    currentFilter = filter;
    document.getElementById('tabAll').classList.toggle('active', filter === 'all');
    document.getElementById('tabUnpaid').classList.toggle('active', filter === 'unpaid');
    document.getElementById('tabPaid').classList.toggle('active', filter === 'paid');
    render();
  }

  function buildWhatsAppLink(debt) {
    const greeting = businessName
      ? `Hello ${debt.customerName}, this is ${businessName}.`
      : `Hello ${debt.customerName},`;
    const owed = remaining(debt);
    const message =
      `${greeting} Just a friendly reminder that ₦${owed.toLocaleString()} ` +
      `is still outstanding on your account. You can complete payment whenever convenient — ` +
      `thank you for your continued patronage! 🙏`;
    return `https://wa.me/${debt.phone}?text=${encodeURIComponent(message)}`;
  }

  function render() {
    const listEl = document.getElementById('debtList');
    const unpaid = allDebts.filter(d => !d.paid);
    const total = unpaid.reduce((sum, d) => sum + remaining(d), 0);

    document.getElementById('totalOutstanding').textContent = '₦' + total.toLocaleString();
    document.getElementById('unpaidCount').textContent = unpaid.length;

    if (allDebts.length === 0) {
      listEl.innerHTML = '<div class="empty"><strong>Ledger is empty</strong>Use /newdebt on Telegram to log your first debt.</div>';
      return;
    }

    const visible = currentFilter === 'all'
      ? allDebts
      : currentFilter === 'paid'
        ? allDebts.filter(d => d.paid)
        : allDebts.filter(d => !d.paid);

    if (visible.length === 0) {
      const msg = currentFilter === 'paid'
        ? '<strong>No paid debts yet</strong>Once a debt is fully paid, it will show up here.'
        : '<strong>Nothing unpaid</strong>Everything on your books is settled ✅';
      listEl.innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }

    listEl.innerHTML = visible.map(debt => {
      const owed = remaining(debt);
      const isPartial = !debt.paid && debt.amountPaid > 0;
      const showPaymentForm = paymentFormOpenFor.has(debt.id);

      return `
      <div class="stub ${debt.paid ? 'is-paid' : ''}">
        ${debt.paid ? '<div class="stamp">PAID</div>' : ''}
        <div class="stub-top">
          <div class="stub-name">${escapeHtml(debt.customerName)}</div>
          <div class="stub-amount">₦${debt.amount.toLocaleString()}</div>
        </div>
        ${isPartial ? `<div class="stub-partial-note">₦${debt.amountPaid.toLocaleString()} paid — ₦${owed.toLocaleString()} left</div>` : ''}
        <hr class="stub-divider">
        ${debt.paid
          ? ''
          : showPaymentForm
            ? `
              <div class="payment-form">
                <input class="payment-input" type="number" id="payInput-${debt.id}" placeholder="₦ amount" />
                <button class="btn btn-remind" style="flex: 0 0 auto;" onclick="submitPayment('${debt.id}', ${owed})">Save</button>
              </div>
            `
            : `
              <div class="stub-actions">
                <a class="btn btn-remind" href="${buildWhatsAppLink(debt)}" target="_blank">Remind</a>
                <button class="btn btn-paid" onclick="openPaymentForm('${debt.id}')">Log Payment</button>
                <button class="btn btn-delete" onclick="deleteDebt('${debt.id}', '${escapeHtml(debt.customerName)}')" title="Delete">🗑</button>
              </div>
            `
        }
      </div>
    `;
    }).join('');
  }

  function openPaymentForm(id) {
    paymentFormOpenFor.add(id);
    render();
    setTimeout(() => {
      const input = document.getElementById(`payInput-${id}`);
      if (input) input.focus();
    }, 0);
  }

  async function submitPayment(id, owed) {
    const input = document.getElementById(`payInput-${id}`);
    const amount = Number(input.value);
    if (!amount || amount <= 0 || amount > owed) {
      alert(`Enter an amount between 1 and ${owed.toLocaleString()}`);
      return;
    }
    await fetch(`/api/debts/${id}/log-payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: accessToken, amount }),
    });
    paymentFormOpenFor.delete(id);
    loadDebts();
  }

  async function deleteDebt(id, customerName) {
    if (!confirm(`Delete this debt for ${customerName}? This can't be undone.`)) return;
    await fetch(`/api/debts/${id}?token=${accessToken}`, { method: 'DELETE' });
    loadDebts();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
